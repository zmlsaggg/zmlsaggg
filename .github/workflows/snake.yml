name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: zmlsaggg
          outputs: |
            dist/snake.svg?color_snake=%23A855F7&color_dots=%23ebedf0,%239f7aea,%237c3aed,%235b21b6,%232e1065
            dist/snake-dark.svg?palette=github-dark&color_snake=%23D946EF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
